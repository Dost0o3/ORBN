          type: integer
        commentsCount:
          type: integer
        repostsCount:
          type: integer
        isLiked:
          type: boolean
        isRepost:
          type: boolean
        isAnonymous:
          type: boolean
        originalPost:
          nullable: true
          $ref: "#/components/schemas/Post"
        createdAt:
          type: string
      required: [id, content, hashtags, likesCount, commentsCount, repostsCount, isLiked, isRepost, createdAt]

    CreatePostBody:
      type: object
      properties:
        content:
          type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        mood:
          type: string
          enum: [motivational, professional, collaborative, creative]
        hashtags:
          type: array
          items:
            type: string
        isAnonymous:
          type: boolean
          description: |
            Per-post anonymity override. When true, the post is stored as
            anonymous regardless of the author's account-wide Ghost Mode
            setting. When false, the post is attributed even if Ghost Mode
            is on. When omitted, the account-wide Ghost Mode setting is
            used.
      required: [content]

    PostsPage:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
        hasMore:
          type: boolean
      required: [posts, total, hasMore]

    Comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        author:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserProfile"
        isAnonymous:
          type: boolean
        createdAt:
          type: string
      required: [id, content, isAnonymous, createdAt]

    CreateCommentBody:
      type: object
      properties:
        content:
          type: string
        isAnonymous:
          type: boolean
          description: |
            When true, the comment is stored as anonymous and other viewers
            (including the parent post's author) see it as "Anonymous". The
            commenter themselves still sees their own real identity. When
            omitted or false, the comment is attributed normally; this
            toggle is independent of the account-wide Ghost Mode setting.
      required: [content]

    UpdateCommentAnonymityBody:
      type: object
      properties:
        isAnonymous:
          type: boolean
          description: |
            New anonymity state for the comment. Setting this to true
            re-anonymizes a previously attributed comment; false reveals an
            anonymous comment back to its real author.
      required: [isAnonymous]

