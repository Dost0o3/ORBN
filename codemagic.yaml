workflows:
  ios-testflight:
    name: ORBN iOS TestFlight Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ORBN_ASC_KEY
    environment:
      vars:
        APP_STORE_APPLE_ID: "ibnayfield@gmail.com"
        BUNDLE_ID: "com.iftid.mobile"
        XCODE_WORKSPACE: "ORBN.xcworkspace"
        XCODE_SCHEME: "ORBN"
        EXPO_PUBLIC_DOMAIN: "nexasid.replit.app"
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_Y2xlcmsubmV4YXNpZC5yZXBsaXQuYXBwJA"
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@9 --force
      - name: Install dependencies (monorepo root)
        script: |
          pnpm install --no-frozen-lockfile
      - name: Expo prebuild iOS
        script: |
          cd artifacts/ift-mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Pod install
        script: |
          cd artifacts/ift-mobile/ios
          pod install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Generate certificate private key
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/codemagic_cert_key -q -N ""
      - name: Fetch signing files (auto-create if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/codemagic_cert_key \
            --create
      - name: List existing certificates (debug)
        script: |
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up provisioning profiles
        script: |
          cd artifacts/ift-mobile/ios
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          cd artifacts/ift-mobile/ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - artifacts/ift-mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
